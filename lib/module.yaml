product:
  type: jvm/lib
  platforms: [ jvm ]

apply:
  - ../kotlin.module-template.yaml
  - ../maven.module-template.yaml

dependencies:
  - $kotlin.test: exported
  # https://github.com/Kotlin/kotlinx-datetime
  - org.jetbrains.kotlinx:kotlinx-datetime:0.7.1: exported
  # https://github.com/ktorio/ktor
  - bom: $ktor.bom
  - $ktor.client.core: exported
  - $ktor.client.cio: exported
  - $ktor.client.logging: exported
  - $ktor.client.auth: exported
  - $ktor.client.contentNegotiation: exported
  - $ktor.client.resources: exported
  - $ktor.serialization.kotlinx.json: exported
  - $ktor.serialization.kotlinx.xml: exported
  # https://github.com/oshai/kotlin-logging
  - io.github.oshai:kotlin-logging:7.0.14: exported
  # https:#github.com/qos-ch/logback/releases
  - ch.qos.logback:logback-classic:1.5.18
settings:
  ktor:
    enabled: true
    version: 3.5.2