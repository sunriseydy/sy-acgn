product:
  type: lib
  platforms: [ jvm ]
apply:
  - ../compose.module-template.yaml
  - ../lib.module-template.yaml
  - ../kotlin.module-template.yaml
  - ../maven.module-template.yaml

dependencies:
  - $compose.foundation: exported
  - # noinspection AmperCanConvertToCatalogVersion
    org.jetbrains.compose.material3:material3:1.10.0-alpha05: exported
  - $compose.components.resources: exported
  - $compose.animation: exported
  - $compose.uiTooling: exported
  - $compose.ui: exported
  - $compose.preview: exported
  # https://github.com/JetBrains/compose-multiplatform
  - org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0-alpha06: exported
  - org.jetbrains.androidx.navigation:navigation-compose:2.9.1: exported
  - org.jetbrains.compose.material3.adaptive:adaptive:1.3.0-alpha02: exported
  - org.jetbrains.compose.material3.adaptive:adaptive-layout:1.3.0-alpha02: exported
  - org.jetbrains.compose.material3.adaptive:adaptive-navigation:1.3.0-alpha02: exported
  - org.jetbrains.compose.material3:material3-adaptive-navigation-suite:1.10.0-alpha05: exported
  # https://github.com/russhwolf/multiplatform-settings
  - com.russhwolf:multiplatform-settings:1.3.0: exported
  - com.russhwolf:multiplatform-settings-no-arg:1.3.0: exported
