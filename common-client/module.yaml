product:
  type: lib
  platforms: [ jvm ]

apply:
  - ../lib.module-template.yaml
  - ../compose.module-template.yaml
  - ../kotlin.module-template.yaml
  - ../maven.module-template.yaml

dependencies:
  - $compose.foundation: exported
  - $compose.material3: exported
  - $compose.components.resources: exported
  - $compose.animation: exported
  - $compose.materialIconsExtended: exported
  - $compose.uiTooling: exported
  - $compose.ui: exported
  - $compose.preview: exported
  # https://github.com/JetBrains/compose-multiplatform
  - org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4: exported
  - org.jetbrains.androidx.navigation:navigation-compose:2.8.0-alpha11: exported
  - org.jetbrains.compose.material3.adaptive:adaptive:1.0.1: exported
  - org.jetbrains.compose.material3.adaptive:adaptive-layout:1.0.1: exported
  - org.jetbrains.compose.material3.adaptive:adaptive-navigation:1.0.1: exported
  - org.jetbrains.compose.material3:material3-adaptive-navigation-suite:1.7.1: exported
  # https://github.com/oshai/kotlin-logging
  - io.github.oshai:kotlin-logging:7.0.0: exported
  # https://github.com/russhwolf/multiplatform-settings
  - com.russhwolf:multiplatform-settings:1.3.0: exported
  - com.russhwolf:multiplatform-settings-no-arg:1.3.0: exported
