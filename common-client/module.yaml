product:
  type: lib
  platforms: [ jvm, wasmJs ]
apply:
  - ../compose.module-template.yaml
  - ../lib.module-template.yaml
  - ../kotlin.module-template.yaml
  - ../maven.module-template.yaml

dependencies:
  - $compose.foundation: exported
  - # noinspection AmperCanConvertToCatalogVersion
    $libs.material3.material3: exported
  - $compose.components.resources: exported
  - $compose.animation: exported
  - $compose.ui: exported
  - $compose.preview: exported
  - $libs.material.icons.core: exported
  - $libs.material.icons.extended: exported
  # https://github.com/JetBrains/compose-multiplatform
  - $libs.lifecycle.viewmodel.compose: exported
  - $libs.lifecycle.viewmodel.navigation3: exported
  - $libs.navigation3.ui: exported
  - $libs.material3.adaptive.adaptive: exported
  - $libs.material3.adaptive.adaptive.layout: exported
  - $libs.material3.adaptive.adaptive.navigation3: exported
  - $libs.material3.material3.adaptive.navigation.suite: exported
  # https://github.com/russhwolf/multiplatform-settings
  - $libs.multiplatform.settings: exported
  - $libs.multiplatform.settings.no.arg: exported
settings:
  kotlin:
    optIns:
      - androidx.compose.material3.adaptive.ExperimentalMaterial3AdaptiveApi
    freeCompilerArgs: [ -Xexpect-actual-classes ]
