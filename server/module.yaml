product: jvm/app
apply:
  - ../jvm.module-template.yaml
  - ../kotlin.module-template.yaml
  - ../maven.module-template.yaml
  - ../lib.module-template.yaml

dependencies:
  # https://github.com/ktorio/ktor
  - bom: $ktor.bom
  - $ktor.server.core: exported
  - $ktor.server.contentNegotiation: exported
  - $ktor.server.callLogging: exported
  - $ktor.server.callId: exported
  - $ktor.server.forwardedHeader: exported
  - $ktor.server.cors: exported
  - $ktor.server.statusPages: exported
  - $ktor.server.resources: exported
  - $ktor.server.cio: exported
  - $ktor.server.configYaml: exported
  # https://github.com/JetBrains/Exposed
  - org.jetbrains.exposed:exposed-core:1.0.0-rc-4
  - org.jetbrains.exposed:exposed-jdbc:1.0.0-rc-4
  - org.jetbrains.exposed:exposed-dao:1.0.0-rc-4
  - org.jetbrains.exposed:exposed-kotlin-datetime:1.0.0-rc-4
  - org.jetbrains.exposed:exposed-json:1.0.0-rc-4
  - org.jetbrains.exposed:exposed-migration-core:1.0.0-rc-4
  - org.jetbrains.exposed:exposed-migration-jdbc:1.0.0-rc-4
  - org.postgresql:postgresql:42.7.8
  - commons-io:commons-io:2.16.1
settings:
  ktor:
    enabled: true
    version: 3.3.3
  kotlin:
    optIns: [ kotlin.time.ExperimentalTime ]