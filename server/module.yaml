product: jvm/app
apply:
  - ../jvm.module-template.yaml
  - ../kotlin.module-template.yaml
  - ../maven.module-template.yaml
  - ../lib.module-template.yaml

dependencies:
  # https://github.com/ktorio/ktor
  - bom: $ktor.bom
  - io.ktor:ktor-server-core-jvm: exported
  - io.ktor:ktor-server-content-negotiation-jvm: exported
  - io.ktor:ktor-server-call-logging-jvm: exported
  - $ktor.server.callId: exported
  - io.ktor:ktor-server-forwarded-header-jvm: exported
  - io.ktor:ktor-server-cors-jvm: exported
  - io.ktor:ktor-server-status-pages-jvm: exported
  - $ktor.server.resources: exported
  - $ktor.server.cio: exported
  - $ktor.server.configYaml: exported
  # https://github.com/JetBrains/Exposed
  - org.jetbrains.exposed:exposed-core:0.61.0
  - org.jetbrains.exposed:exposed-jdbc:0.61.0
  - org.jetbrains.exposed:exposed-dao:0.61.0
  - org.jetbrains.exposed:exposed-kotlin-datetime:0.61.0
  - org.jetbrains.exposed:exposed-json:0.61.0
  - org.jetbrains.exposed:exposed-migration:0.61.0
  - org.postgresql:postgresql:42.7.7
  - commons-io:commons-io:2.16.1
settings:
  jvm:
    mainClass: dev.sunriseydy.acgn.server.ServerMainKt
  ktor:
    enabled: true
    version: 3.3.3