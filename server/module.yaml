product: jvm/app
apply:
  - ../jvm.module-template.yaml
  - ../kotlin.module-template.yaml
  - ../maven.module-template.yaml
  - ../lib.module-template.yaml

dependencies:
  # https://github.com/ktorio/ktor
  - bom: $ktor.bom
  - $ktor.server.core
  - $ktor.server.contentNegotiation
  - $ktor.server.callLogging
  - $ktor.server.callId
  - $ktor.server.forwardedHeader
  - $ktor.server.cors
  - $ktor.server.statusPages
  - $ktor.server.resources
  - $ktor.server.cio
  - $ktor.server.config.yaml
  - $libs.ktor.server.di
  # https://github.com/JetBrains/Exposed
  - $libs.exposed.core
  - $libs.exposed.jdbc
  - $libs.exposed.dao
  - $libs.exposed.kotlin.datetime
  - $libs.exposed.json
  - $libs.exposed.migration.core
  - $libs.exposed.migration.jdbc
  - $libs.postgresql
  # Caffeine cache
  - com.github.ben-manes.caffeine:caffeine:3.1.8
  # dotenv
  - io.github.cdimascio:dotenv-kotlin:6.4.1
  # AWS S3 SDK
  - software.amazon.awssdk:s3:2.25.15
settings:
  ktor:
    enabled: true
    applyBom: true
    version: 3.5.2
  kotlin:
    optIns: [ kotlin.time.ExperimentalTime ]