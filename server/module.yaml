product: jvm/app
apply:
  - ../jvm.module-template.yaml
  - ../kotlin.module-template.yaml
  - ../maven.module-template.yaml
  - ../lib.module-template.yaml

dependencies:
  # https://github.com/ktorio/ktor
  - bom: $ktor.bom
  - $ktor.server.core
  - $ktor.server.contentNegotiation
  - $ktor.server.callLogging
  - $ktor.server.callId
  - $ktor.server.forwardedHeader
  - $ktor.server.cors
  - $ktor.server.statusPages
  - $ktor.server.resources
  - $ktor.server.cio
  - $ktor.server.config.yaml
  - io.ktor:ktor-server-di
  # https://github.com/JetBrains/Exposed
  - org.jetbrains.exposed:exposed-core:1.2.0
  - org.jetbrains.exposed:exposed-jdbc:1.2.0
  - org.jetbrains.exposed:exposed-dao:1.2.0
  - org.jetbrains.exposed:exposed-kotlin-datetime:1.2.0
  - org.jetbrains.exposed:exposed-json:1.2.0
  - org.jetbrains.exposed:exposed-migration-core:1.2.0
  - org.jetbrains.exposed:exposed-migration-jdbc:1.2.0
  - org.postgresql:postgresql:42.7.11
  - commons-io:commons-io:2.16.1
  # Caffeine cache
  - com.github.ben-manes.caffeine:caffeine:3.1.8
  # dotenv
  - io.github.cdimascio:dotenv-kotlin:6.4.1
settings:
  ktor:
    enabled: true
  kotlin:
    optIns: [ kotlin.time.ExperimentalTime ]